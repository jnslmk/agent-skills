name: Renovate

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Update dependencies and materialize pristine skills
        env:
          RENOVATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: '["${{ github.repository }}"]'
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_BINARY_SOURCE: global
          RENOVATE_ALLOWED_COMMANDS: '["^python3 scripts/sync.py --renovate$"]'
          # 44.14.3 gates post-upgrade commands with allowedCommands, not allowScripts.
          # Keep package install scripts and shell execution disabled.
          RENOVATE_ALLOW_SCRIPTS: 'false'
          RENOVATE_ALLOW_SHELL_EXECUTOR_FOR_POST_UPGRADE_COMMANDS: 'false'
          RENOVATE_GIT_AUTHOR: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
        run: npx --yes renovate@44.14.3
      - name: Dispatch read-only checks for Renovate PR heads
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        # GITHUB_TOKEN PR creation does not trigger pull_request workflows.
        # Pass branch names as quoted arguments, never executable shell text.
        run: |
          gh pr list --state open --limit 100 --json headRefName,isCrossRepository \
            --jq '.[] | select(.isCrossRepository == false) | .headRefName | select(startswith("renovate/"))' |
          while IFS= read -r branch; do
            gh workflow run check.yml --ref "$branch"
          done
