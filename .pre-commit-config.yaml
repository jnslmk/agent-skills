# Secret scanning for the skills repo. Mirrors nas-ansible's convention.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
      - id: gitleaks
        alias: gitleaks-dir
        name: Scan skill files for secrets
        entry: gitleaks dir . --redact --no-banner --gitleaks-ignore-path=/dev/null
        stages: [manual]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        files: ^(?:\.github/|scripts/|[^/]+$)
      - id: check-merge-conflict
